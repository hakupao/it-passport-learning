<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>A2 今日</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#FFFFFF}
a{color:#1D1D1F;text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="min-height: 1100px; display: flex; flex-wrap: wrap; background: #FFFFFF; color: #1D1D1F; font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'PingFang SC', 'Segoe UI', sans-serif; font-size: 14px; line-height: 1.55">

  <nav aria-label="主导航" style="flex: 1 1 200px; max-width: 220px; box-sizing: border-box; background: #F5F5F5; border-right: 1px solid #E3E3E3; padding: 20px 8px; display: flex; flex-direction: column; gap: 2px">
    <div style="padding: 0 10px 14px; font-weight: 600">IT Passport</div>
    <a href="#" aria-current="page" style="padding: 6px 10px; border-radius: 6px; background: #E3E3E8; font-weight: 600">今日</a>
    <a href="#" style="padding: 6px 10px; border-radius: 6px">练习</a>
    <a href="#" style="padding: 6px 10px; border-radius: 6px">教科书</a>
    <a href="#" style="padding: 6px 10px; border-radius: 6px">辞典</a>
    <a href="#" style="padding: 6px 10px; border-radius: 6px">记录</a>
    <div style="margin-top: auto; padding: 0 10px; font-size: 12px; color: #6E6E73">日 / <strong style="color: #1D1D1F">中</strong> / EN　·　<a href="#" style="color: #6E6E73">设置</a></div>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; padding: 40px 56px 64px">
    <div style="max-width: 720px">
      <div style="color: #6E6E73; font-size: 13px">10月23日 星期五 · 距离考试 38 天</div>
      <h1 style="margin: 4px 0 0; font-size: 24px; font-weight: 600">今日</h1>

      <div style="margin-top: 24px; display: flex; align-items: center; gap: 16px; padding: 18px 20px; background: #F5F5F5; border-radius: 10px">
        <div style="flex: 1">
          <div style="font-size: 17px; font-weight: 600">复习 23 题，读 1 个单元</div>
          <div style="color: #6E6E73; font-size: 13px">错题 15 · 到期 8 ·《关系数据库与正规化》</div>
        </div>
        <button type="button" style="height: 40px; padding: 0 22px; border: 0; border-radius: 6px; background: #1D1D1F; color: #FFFFFF; font-weight: 600">开始</button>
      </div>

      <h2 style="margin: 36px 0 8px; font-size: 13px; font-weight: 600; color: #6E6E73">薄弱领域</h2>
      <div style="border: 1px solid #E3E3E3; border-radius: 10px; overflow: hidden">
        <sc-for list="{{weak}}" as="w" hint-placeholder-count="5">
          <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 11px 16px; border-top: {{w.sep}}">
            <span lang="ja" style="flex: 1">{{w.name}}</span>
            <span style="color: #6E6E73; font-size: 13px; font-variant-numeric: tabular-nums">{{w.done}} 题</span>
            <span style="width: 44px; text-align: right; font-variant-numeric: tabular-nums">{{w.rate}}%</span>
            <span aria-hidden="true" style="color: #C7C7CC">›</span>
          </a>
        </sc-for>
      </div>

      <h2 style="margin: 32px 0 8px; font-size: 13px; font-weight: 600; color: #6E6E73">最近</h2>
      <div style="border: 1px solid #E3E3E3; border-radius: 10px; overflow: hidden">
        <a href="#" style="display: flex; gap: 12px; padding: 11px 16px"><span style="flex: 1">令和7年度 20 题</span><span style="color: #6E6E73; font-size: 13px">昨天 · 对 14 错 6</span><span aria-hidden="true" style="color: #C7C7CC">›</span></a>
        <a href="#" style="display: flex; gap: 12px; padding: 11px 16px; border-top: 1px solid #E3E3E3"><span style="flex: 1">二进制数与基数</span><span style="color: #6E6E73; font-size: 13px">前天 · 读到 60%</span><span aria-hidden="true" style="color: #C7C7CC">›</span></a>
      </div>

      <div style="margin-top: 28px; color: #6E6E73; font-size: 13px">累计 412 / 2,900 题 · 正答率 71% · 教科书 37 / 244</div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const weak = [
      { name: '知的財産権', done: 21, rate: 48 },
      { name: 'データベース設計', done: 17, rate: 53 },
      { name: 'ネットワーク方式', done: 25, rate: 56 },
      { name: '会計・財務', done: 14, rate: 57 },
      { name: 'プロジェクトマネジメント', done: 30, rate: 60 }
    ].map((w, i) => ({ ...w, sep: i === 0 ? '0' : '1px solid #E3E3E3' }));
    return { weak };
  }
}
</script>
</body>
</html>

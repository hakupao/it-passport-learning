<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>A3 今日</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFEFA}
a{color:#1B2A4A;text-decoration:underline;text-underline-offset:3px}a:hover{color:#0E1830}
button{font:inherit;cursor:pointer}
th,td{text-align:left;font-weight:400}
</style>
</helmet>
<div style="min-height: 1100px; background: #FFFEFA; color: #1B2A4A; font-family: 'Zen Kaku Gothic New', 'Noto Sans SC', sans-serif; font-size: 15px; line-height: 1.75; border-top: 6px solid #1B2A4A">

  <header style="max-width: 1100px; margin: 0 auto; padding: 14px 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 24px; border-bottom: 1px solid #C9CFDA">
    <div style="font-weight: 700">ITパスポート 合格ノート</div>
    <nav aria-label="主导航" style="display: flex; gap: 20px; font-size: 14px">
      <a href="#" aria-current="page" style="text-decoration: none; font-weight: 700">今日</a>
      <a href="#" style="text-decoration: none; color: #5A6680">练习</a>
      <a href="#" style="text-decoration: none; color: #5A6680">教科书</a>
      <a href="#" style="text-decoration: none; color: #5A6680">辞典</a>
      <a href="#" style="text-decoration: none; color: #5A6680">记录</a>
    </nav>
    <div style="margin-left: auto; font-size: 13px; color: #5A6680">日 / <strong style="color: #1B2A4A">中</strong> / EN</div>
  </header>

  <main style="max-width: 1100px; margin: 0 auto; padding: 36px 32px 64px">
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 24px">
      <div style="flex: 1 1 480px">
        <div style="font-size: 13px; color: #5A6680">10月23日（五）</div>
        <h1 style="margin: 4px 0 0; font-size: 28px; font-weight: 700"><span style="background: linear-gradient(transparent 60%, #FFE36E 60%)">今天：复习 23 题，读 1 个单元</span></h1>
        <div style="margin-top: 6px; color: #5A6680">错题 15 · 到期 8 ·《关系数据库与正规化》</div>
      </div>
      <div style="border: 1.5px solid #1B2A4A; padding: 8px 18px; text-align: center">
        <div style="font-size: 12px; color: #5A6680">考试还有</div>
        <div style="font-size: 30px; font-weight: 700; line-height: 1.1">38<span style="font-size: 14px"> 天</span></div>
      </div>
      <button type="button" style="height: 52px; padding: 0 36px; border: 0; border-radius: 0; background: #1B2A4A; color: #FFFEFA; font-size: 16px; font-weight: 700">开始</button>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 48px; margin-top: 44px">
      <section aria-label="薄弱领域" style="flex: 1 1 440px">
        <div><span style="background: #1B2A4A; color: #FFFEFA; font-weight: 700; padding: 2px 12px; font-size: 14px">薄弱领域</span></div>
        <table style="margin-top: 12px; width: 100%; border-collapse: collapse; font-size: 14px">
          <tbody>
            <sc-for list="{{weak}}" as="w" hint-placeholder-count="5">
              <tr style="border-bottom: 1px solid #C9CFDA">
                <td lang="ja" style="padding: 10px 0">{{w.name}}</td>
                <td style="width: 140px"><div style="height: 8px; background: #E6E9EF"><div style="{{w.bar}}"></div></div></td>
                <td style="width: 52px; text-align: right; font-variant-numeric: tabular-nums">{{w.rate}}%</td>
                <td style="width: 72px; text-align: right"><a href="#">练 10 题</a></td>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </section>
      <section aria-label="最近" style="flex: 1 1 340px">
        <div><span style="background: #1B2A4A; color: #FFFEFA; font-weight: 700; padding: 2px 12px; font-size: 14px">最近</span></div>
        <table style="margin-top: 12px; width: 100%; border-collapse: collapse; font-size: 14px">
          <tbody>
            <tr style="border-bottom: 1px solid #C9CFDA"><td style="padding: 10px 0">昨天　令和7年度 20 题</td><td style="text-align: right">对 14 · 错 6</td><td style="text-align: right"><a href="#">重做错题</a></td></tr>
            <tr style="border-bottom: 1px solid #C9CFDA"><td style="padding: 10px 0">前天　二进制数与基数</td><td style="text-align: right">读到 60%</td><td style="text-align: right"><a href="#">继续</a></td></tr>
          </tbody>
        </table>
        <div style="margin-top: 16px; border: 1.5px solid {{accent}}; padding: 12px 16px">
          <div style="color: {{accent}}; font-weight: 700; font-size: 13px">累计</div>
          <div style="font-size: 14px">过去问 412 / 2,900 题 · 正答率 71% · 教科书 37 / 244</div>
        </div>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#B85309","options":["#B85309","#C2185B","#2E7D32"]},"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#B85309';
    const weak = [
      { name: '知的財産権', rate: 48 },
      { name: 'データベース設計', rate: 53 },
      { name: 'ネットワーク方式', rate: 56 },
      { name: '会計・財務', rate: 57 },
      { name: 'プロジェクトマネジメント', rate: 60 }
    ].map(w => ({ ...w, bar: 'height: 8px; width: ' + w.rate + '%; background: ' + accent }));
    return { accent, weak };
  }
}
</script>
</body>
</html>
